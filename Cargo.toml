[workspace]
members = [".", "simsym-macros"]
resolver = "2"

[package]
name = "simsym"
version = "0.1.0"
edition = "2024"
description = "A simple symbolic computation library"
license = "BSD-3-Clause"

[dependencies]
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
simsym-macros = { path = "simsym-macros" }
thiserror = "2"

serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
bigint = ["num-rational/num-bigint", "dep:num-bigint"]
serde = ["dep:serde", "num-rational/serde"]

[dependencies.num-bigint]
version = "0.4"
optional = true

[dev-dependencies]
proptest = "1"

[lib]
name = "simsym"
path = "src/lib.rs"
